name: Proverby Weekly Cron

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

jobs:
  aggiorna_weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Call aggiorna_weekly
        run: |
          curl -v -L -X GET "https://proverby.it/api/aggiorna_weekly" \
            -H "X-CRON-KEY: ${{ secrets.CRON_KEY }}"